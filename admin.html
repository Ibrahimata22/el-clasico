<body>

  <div class="login">
    <h2>El Clasico</h2>
    <p>تسجيل دخول صاحب الملعب</p>

    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">

    <button id="loginBtn">تسجيل الدخول</button>
    <p id="message"></p>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://rqcvjbpxntwqhoftupat.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_ynKIqc436PsqVFt620RgMw_b35h5KO0";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const message = document.getElementById("message");

    let allBookings = [];
    let selectedDay = "";
    let lastTodayKey = getEgyptDateKey();

    let weeklyHistory = [];
    let monthlyHistory = [];

    let selectedWeek = "";
    let selectedMonth = "";

    // التاريخ الحالي حسب توقيت مصر
    function getEgyptDateKey(date = new Date()) {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Africa/Cairo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);

      const values = {};

      parts.forEach(part => {
        values[part.type] = part.value;
      });

      return `${values.year}-${values.month}-${values.day}`;
    }

    function dateObject(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day));
    }

    function dateKeyFromObject(date) {
      return date.toISOString().slice(0, 10);
    }

    function addDays(dateKey, days) {
      const date = dateObject(dateKey);
      date.setUTCDate(date.getUTCDate() + days);
      return dateKeyFromObject(date);
    }

    function formatDate(dateKey) {
      const date = dateObject(dateKey);

      return new Intl.DateTimeFormat("ar-EG", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        timeZone: "UTC"
      }).format(date);
    }

    function getCurrentWeekStart() {
      const today = getEgyptDateKey();
      const day = dateObject(today).getUTCDay();

      // السبت = 6
      const daysSinceSaturday = (day + 1) % 7;

      return addDays(today, -daysSinceSaturday);
    }

    function getCurrentMonthStart() {
      const today = getEgyptDateKey();
      return today.slice(0, 7) + "-01";
    }

    function getMonthEnd(start) {
      const date = dateObject(start);
      date.setUTCMonth(date.getUTCMonth() + 1);
      date.setUTCDate(0);
      return dateKeyFromObject(date);
    }

    function formatReceivedTime(timestamp) {
      if (!timestamp) return "غير متوفر";

      return new Intl.DateTimeFormat("ar-EG", {
        timeZone: "Africa/Cairo",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).format(new Date(timestamp));
    }

    function formatHour(hour) {
      const h = Number(hour);

      if (h === 0) return "12:00 صباحًا";
      if (h < 12) return `${h}:00 صباحًا`;
      if (h === 12) return "12:00 ظهرًا";

      return `${h - 12}:00 مساءً`;
    }

    function formatAppointmentDate(dateKey, hour) {
      return `${formatDate(dateKey)} - ${formatHour(hour)}`;
    }

    function getStatusText(status) {
      switch (String(status).toLowerCase()) {
        case "pending": return "تحت المراجعة";
        case "confirmed": return "مؤكد - محجوز";
        case "rejected": return "مرفوض";
        default: return status || "غير معروف";
      }
    }

    function getStatusClass(status) {
      const value = String(status).toLowerCase();

      if (value === "pending") return "pending";
      if (value === "confirmed") return "confirmed";
      if (value === "rejected") return "rejected";

      return "";
    }

    document.getElementById("loginBtn").addEventListener(
      "click",
      async () => {
        message.textContent = "جاري تسجيل الدخول...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          message.textContent =
            "بيانات الدخول غير صحيحة أو تعذر تسجيل الدخول.";
          return;
        }

        const { data, error: adminError } =
          await supabase.rpc("is_admin");

        if (adminError || data !== true) {
          await supabase.auth.signOut();
          message.textContent =
            "هذا الحساب ليس لديه صلاحيات الإدارة.";
          return;
        }

        showDashboard();
      }
    );

    function showDashboard() {
      document.querySelector(".login").innerHTML = `
        <h2>لوحة تحكم ملعب الكلاسيكو</h2>
        <p>مرحباً بك يا صاحب الملعب</p>

        <div class="statistics-section">
          <h3>الإحصائيات الأسبوعية</h3>
          <p class="section-label">اختر الأسبوع</p>
          <select id="weekSelect"></select>
          <div id="weeklyStats" class="stats-loading">
            جاري تحميل الإحصائيات...
          </div>
        </div>

        <div class="statistics-section">
          <h3>الإحصائيات الشهرية</h3>
          <p class="section-label">اختر الشهر</p>
          <select id="monthSelect"></select>
          <div id="monthlyStats" class="stats-loading">
            جاري تحميل الإحصائيات...
          </div>
        </div>

        <p class="section-label">اختر يوم مراجعة الطلبات</p>
        <select id="daySelect"></select>

        <button class="refresh-btn" id="refreshBtn">
          تحديث الحجوزات والإحصائيات
        </button>

        <div id="bookings">جاري تحميل الحجوزات...</div>

        <button class="logout-btn" id="logoutBtn">
          تسجيل الخروج
        </button>
      `;

      document.getElementById("daySelect").addEventListener(
        "change",
        event => {
          selectedDay = event.target.value;
          renderBookings();
        }
      );

      document.getElementById("weekSelect").addEventListener(
        "change",
        event => {
          selectedWeek = event.target.value;
          loadOneStatistics("weekly", selectedWeek, "weeklyStats");
        }
      );

      document.getElementById("monthSelect").addEventListener(
        "change",
        event => {
          selectedMonth = event.target.value;
          loadOneStatistics("monthly", selectedMonth, "monthlyStats");
        }
      );

      document.getElementById("refreshBtn").addEventListener(
        "click",
        async () => {
          await loadBookings();
          await loadStatistics();
        }
      );

      document.getElementById("logoutBtn").addEventListener(
        "click",
        async () => {
          await supabase.auth.signOut();
          location.reload();
        }
      );

      loadBookings();
      loadStatistics();

      // الانتقال تلقائيًا لليوم الجديد بتوقيت مصر
      setInterval(() => {
        const today = getEgyptDateKey();

        if (today !== lastTodayKey) {
          const wasShowingToday = selectedDay === lastTodayKey;

          lastTodayKey = today;

          if (wasShowingToday) {
            selectedDay = today;
          }

          loadBookings();
          loadStatistics();
        }
      }, 30000);
    }

    async function loadBookings() {
      const area = document.getElementById("bookings");

      if (!area) return;

      area.textContent = "جاري تحميل الحجوزات...";

      const { data, error } = await supabase
        .from("bookings")
        .select("*")
        .order("created_at", { ascending: true });

      if (error) {
        area.textContent = "تعذر تحميل الحجوزات.";
        return;
      }

      allBookings = data || [];

      const today = getEgyptDateKey();

      if (!selectedDay) {
        selectedDay = today;
      }

      renderDayOptions();
      renderBookings();
    }

    function renderDayOptions() {
      const select = document.getElementById("daySelect");

      if (!select) return;

      const today = getEgyptDateKey();
      const days = new Set([today]);

      allBookings.forEach(booking => {
        if (booking.created_at) {
          days.add(getEgyptDateKey(new Date(booking.created_at)));
        }
      });

      const sortedDays = Array.from(days).sort().reverse();

      if (!days.has(selectedDay)) {
        selectedDay = today;
      }

      select.innerHTML = sortedDays.map(day => `
        <option value="${day}" ${day === selectedDay ? "selected" : ""}>
          ${escapeHTML(formatDate(day))}
          ${day === today ? " - اليوم الحالي" : ""}
        </option>
      `).join("");
    }

    function renderBookings() {
      const area = document.getElementById("bookings");

      if (!area) return;

      const today = getEgyptDateKey();

      const dayBookings = allBookings
        .filter(booking => {
          if (!booking.created_at) return false;

          return getEgyptDateKey(new Date(booking.created_at)) === selectedDay;
        })
        .sort((a, b) => {
          return new Date(a.created_at) - new Date(b.created_at);
        });

      const heading = `
        <div class="day-title">
          طلبات يوم ${escapeHTML(formatDate(selectedDay))}
          ${selectedDay === today ? " - اليوم الحالي" : ""}
        </div>
      `;

      if (dayBookings.length === 0) {
        area.innerHTML = heading + `
          <div class="empty">
            لا توجد طلبات حجز وصلت في هذا اليوم.
          </div>
        `;
        return;
      }

      area.innerHTML = heading + dayBookings.map(booking => {
        const status = String(booking.status || "").toLowerCase();
        const receivedTime = formatReceivedTime(booking.created_at);

        const appointment = formatAppointmentDate(
          booking.booking_date,
          booking.start_hour
        );

        let buttons = "";

        if (status === "pending") {
          buttons = `
            <button class="action-btn confirm-btn"
              onclick="updateBooking(${Number(booking.id)}, 'confirmed')">
              تأكيد الحجز
            </button>

            <button class="action-btn reject-btn"
              onclick="updateBooking(${Number(booking.id)}, 'rejected')">
              رفض الحجز
            </button>
          `;
        } else if (status === "confirmed") {
          buttons = `
            <button class="action-btn cancel-btn"
              onclick="updateBooking(${Number(booking.id)}, 'rejected')">
              إلغاء الحجز
            </button>
          `;
        }

        return `
          <div class="booking">
            <p class="received">
              وقت وصول الطلب: ${escapeHTML(receivedTime)}
            </p>

            <p>
              الاسم: ${escapeHTML(booking.customer_name)}
            </p>

            <p>
              الهاتف: ${escapeHTML(booking.phone)}
            </p>

            <p class="appointment">
              موعد الحجز المطلوب: ${escapeHTML(appointment)}
            </p>

            <p>
              المدة: ${Number(booking.duration || 1)} ساعة
            </p>

            <p>
              السعر: ${Number(booking.price)} جنيه
            </p>

            <p class="status ${getStatusClass(status)}">
              الحالة: ${escapeHTML(getStatusText(status))}
            </p>

            ${buttons}
          </div>
        `;
      }).join("");
    }

    // تحميل الفترات المحفوظة
    async function loadStatistics() {
      const weeklyArea = document.getElementById("weeklyStats");
      const monthlyArea = document.getElementById("monthlyStats");

      if (!weeklyArea || !monthlyArea) return;

      weeklyArea.textContent = "جاري تحميل الإحصائيات...";
      monthlyArea.textContent = "جاري تحميل الإحصائيات...";

      const { data, error } = await supabase
        .from("booking_statistics")
        .select("*")
        .order("period_start", { ascending: false });

      if (error) {
        weeklyArea.innerHTML =
          '<div class="stats-error">تعذر تحميل الإحصائيات الأسبوعية.</div>';
        monthlyArea.innerHTML =
          '<div class="stats-error">تعذر تحميل الإحصائيات الشهرية.</div>';
        return;
      }

      const records = data || [];

      weeklyHistory = records.filter(
        item => item.period_type === "weekly"
      );

      monthlyHistory = records.filter(
        item => item.period_type === "monthly"
      );

      const currentWeek = getCurrentWeekStart();
      const currentMonth = getCurrentMonthStart();

      selectedWeek = selectedWeek || currentWeek;
      selectedMonth = selectedMonth || currentMonth;

      renderStatisticsOptions();

      await Promise.all([
        loadOneStatistics("weekly", selectedWeek, "weeklyStats"),
        loadOneStatistics("monthly", selectedMonth, "monthlyStats")
      ]);
    }

    function renderStatisticsOptions() {
      const weekSelect = document.getElementById("weekSelect");
      const monthSelect = document.getElementById("monthSelect");

      if (!weekSelect || !monthSelect) return;

      const currentWeek = getCurrentWeekStart();
      const currentMonth = getCurrentMonthStart();

      const weekOptions = new Map();
      weekOptions.set(currentWeek, "الأسبوع الحالي");

      weeklyHistory.forEach(item => {
        const label =
          `${formatDate(item.period_start)} إلى ${formatDate(item.period_end)}`;
        weekOptions.set(item.period_start, label);
      });

      const monthOptions = new Map();
      monthOptions.set(currentMonth, "الشهر الحالي");

      monthlyHistory.forEach(item => {
        const label = formatDate(item.period_start);
        monthOptions.set(item.period_start, label);
      });

      if (!weekOptions.has(selectedWeek)) {
        selectedWeek = currentWeek;
      }

      if (!monthOptions.has(selectedMonth)) {
        selectedMonth = currentMonth;
      }

      weekSelect.innerHTML = Array.from(weekOptions.entries())
        .map(([value, label]) => `
          <option value="${value}" ${value === selectedWeek ? "selected" : ""}>
            ${escapeHTML(label)}
          </option>
        `).join("");

      monthSelect.innerHTML = Array.from(monthOptions.entries())
        .map(([value, label]) => `
          <option value="${value}" ${value === selectedMonth ? "selected" : ""}>
            ${escapeHTML(label)}
          </option>
        `).join("");
    }

    async function loadOneStatistics(type, start, areaId) {
      const area = document.getElementById(areaId);

      if (!area || !start) return;

      area.textContent = "جاري تحميل الإحصائيات...";

      const isWeekly = type === "weekly";

      const currentStart = isWeekly
        ? getCurrentWeekStart()
        : getCurrentMonthStart();

      const isCurrent = start === currentStart;

      let stats = null;

      if (isCurrent) {
        const end = isWeekly
          ? addDays(start, 6)
          : getMonthEnd(start);

        const { data, error } = await supabase.rpc(
          "calculate_booking_statistics",
          {
            p_period_type: type,
            p_period_start: start,
            p_period_end: end
          }
        );

        if (error) {
          area.innerHTML =
            '<div class="stats-error">تعذر حساب الإحصائيات الحالية.</div>';
          return;
        }

        stats = Array.isArray(data) ? data[0] : data;
      } else {
        const history = isWeekly ? weeklyHistory : monthlyHistory;

        const record = history.find(
          item => item.period_start === start
        );

        if (record) {
          stats = {
            confirmed_count: record.confirmed_count,
            rejected_count: record.rejected_count,
            pending_count: record.pending_count,
            cancelled_count: record.cancelled_count,
            confirmed_revenue: record.confirmed_revenue
          };
        }
      }

      if (!stats) {
        area.innerHTML = `
          <div class="empty">
            لا توجد إحصائيات محفوظة لهذه الفترة.
          </div>
        `;
        return;
      }

      renderStatistics(area, stats, isCurrent);
    }

    function renderStatistics(area, stats, isCurrent) {
      const confirmed = Number(stats.confirmed_count || 0);
      const rejected = Number(stats.rejected_count || 0);
      const pending = Number(stats.pending_count || 0);
      const cancelled = Number(stats.cancelled_count || 0);
      const revenue = Number(stats.confirmed_revenue || 0);

      area.innerHTML = `
        <div class="stats-grid">

          <div class="stat-card stat-confirmed">
            <div class="stat-name">الحجوزات المؤكدة</div>
            <div class="stat-value">${confirmed}</div>
          </div>

          <div class="stat-card stat-rejected">
            <div class="stat-name">الطلبات المرفوضة</div>
            <div class="stat-value">${rejected}</div>
          </div>

          <div class="stat-card stat-pending">
            <div class="stat-name">تحت المراجعة</div>
            <div class="stat-value">${pending}</div>
          </div>

          <div class="stat-card stat-cancelled">
            <div class="stat-name">الحجوزات الملغاة</div>
            <div class="stat-value">${cancelled}</div>
          </div>

          <div class="stat-card stat-revenue">
            <div class="stat-name">إجمالي الإيرادات من المؤكد فقط</div>
            <div class="stat-value">${revenue.toLocaleString("en-US")} جنيه</div>
          </div>

        </div>

        <div class="statistics-info">
          ${
            isCurrent
              ? "إحصائيات الفترة الحالية، ويتم تحديثها من الحجوزات المسجلة."
              : "إحصائيات محفوظة للفترة السابقة، ولا تتغير عند تعديل حالات الحجوزات لاحقًا."
          }
          <br>
          الإيرادات محسوبة بالسعر الكامل قبل خصم العربون.
        </div>
      `;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    window.updateBooking = async function(id, newStatus) {
      const { error } = await supabase
        .from("bookings")
        .update({ status: newStatus })
        .eq("id", id);

      if (error) {
        alert("تعذر تحديث حالة الحجز");
        return;
      }

      alert(
        newStatus === "confirmed"
          ? "تم تأكيد الحجز بنجاح"
          : "تم رفض الحجز أو إلغاء الحجز بنجاح"
      );

      await loadBookings();
      await loadStatistics();
    };
  </script>

</body>
</html>
